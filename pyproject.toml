bug_tracker_url = "https://github.com/jedie/django-for-runners/issues"
upstream_version = "0.20.1"
ynh_version = "+ynh1"
package_description = "YunoHost app package for https://github.com/jedie/django-for-runners"
license = "GPL-3.0-or-later"
